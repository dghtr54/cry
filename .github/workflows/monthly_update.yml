name: Monthly Update

on:
  schedule:
    - cron: '0 2 18 * *'
  workflow_dispatch:
    inputs:
      fddi_article_url:
        description: '（可选）复旦-ZEW 文章 URL，例如 https://fddi.fudan.edu.cn/d7/28/c40448a775976/page.htm。留空则自动查找'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      FDDI_ARTICLE_URL: ${{ github.event.inputs.fddi_article_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行月度更新
        run: python run.py

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          git diff --cached --quiet || git commit -m "auto: monthly update $(date +%Y-%m)"
          git push
